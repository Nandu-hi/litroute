    <meta name="dc.description" content="The safety, stability, and long-term performance of reinforced concrete (RC) structures depend significantly on soil-structure interaction (SSI), a critical phenomenon governing the dynamic relationship between soil and structural behaviour. SSI plays a pivotal role in seismic design, influencing the stiffness, damping, and natural frequency of structures, yet its application in practical design remains underutilized due to challenges in modelling and integrating code provisions. This review synthesizes existing knowledge on SSI, emphasizing its impact on buildings, bridges, and foundations under static and dynamic loads. It highlights advancements in analytical, numerical, and experimental modelling methods, such as finite element analysis and discrete element methods, and evaluates their effectiveness in capturing the complex interactions between soil and structural systems. The review identifies key gaps, including a lack of unified guidelines in international codes, inadequate integration of SSI in real-world design processes, and limited exploration of its role in emerging engineering challenges like sustainability and climate resilience. Historical seismic events, such as the Kobe and Loma Prieta earthquakes, are analysed to underscore the detrimental consequences of neglecting SSI considerations. Additionally, the review discusses recent innovations, including the application of machine learning and advanced computational tools, and their potential to enhance the accuracy and efficiency of SSI analysis. This study offers actionable insights for improving design practices, such as adapting SSI frameworks for structures on soft soils and incorporating dynamic interactions in seismic design codes. It concludes with a call for interdisciplinary collaboration and future research into novel SSI applications, including its integration with smart sensing technologies and sustainable infrastructure design. This review bridges the gap between theoretical advancements and practical applications of soil-structure interaction (SSI) by synthesizing current knowledge, identifying critical research gaps, and proposing innovative solutions to enhance structural resilience, sustainability, and seismic safety. &#10146;&amp;nbsp;The introduction of SSI and the previous studies in seismic design is debated. &#10146; Need, significance and the standard code provisions of SSI of different countries are explained. &#10146;&amp;nbsp;Solving methods of SSI are discussed."/>

    <meta property="og:description" content="The safety, stability, and long-term performance of reinforced concrete (RC) structures depend significantly on soil-structure interaction (SSI), a critical phenomenon governing the dynamic relationship between soil and structural behaviour. SSI plays a pivotal role in seismic design, influencing the stiffness, damping, and natural frequency of structures, yet its application in practical design remains underutilized due to challenges in modelling and integrating code provisions. This review synthesizes existing knowledge on SSI, emphasizing its impact on buildings, bridges, and foundations under static and dynamic loads. It highlights advancements in analytical, numerical, and experimental modelling methods, such as finite element analysis and discrete element methods, and evaluates their effectiveness in capturing the complex interactions between soil and structural systems. The review identifies key gaps, including a lack of unified guidelines in international codes, inadequate integration of SSI in real-world design processes, and limited exploration of its role in emerging engineering challenges like sustainability and climate resilience. Historical seismic events, such as the Kobe and Loma Prieta earthquakes, are analysed to underscore the detrimental consequences of neglecting SSI considerations. Additionally, the review discusses recent innovations, including the application of machine learning and advanced computational tools, and their potential to enhance the accuracy and efficiency of SSI analysis. This study offers actionable insights for improving design practices, such as adapting SSI frameworks for structures on soft soils and incorporating dynamic interactions in seismic design codes. It concludes with a call for interdisciplinary collaboration and future research into novel SSI applications, including its integration with smart sensing technologies and sustainable infrastructure design. This review bridges the gap between theoretical advancements and practical applications of soil-structure interaction (SSI) by synthesizing current knowledge, identifying critical research gaps, and proposing innovative solutions to enhance structural resilience, sustainability, and seismic safety. Graphical Abstract"/>

    <script type="application/ld+json">{"mainEntity":{"headline":"Advancing soil-structure interaction (SSI): a comprehensive review of current practices, challenges, and future directions","description":"The safety, stability, and long-term performance of reinforced concrete (RC) structures depend significantly on soil-structure interaction (SSI), a critical phenomenon governing the dynamic relationship between soil and structural behaviour. SSI plays a pivotal role in seismic design, influencing the stiffness, damping, and natural frequency of structures, yet its application in practical design remains underutilized due to challenges in modelling and integrating code provisions. This review synthesizes existing knowledge on SSI, emphasizing its impact on buildings, bridges, and foundations under static and dynamic loads. It highlights advancements in analytical, numerical, and experimental modelling methods, such as finite element analysis and discrete element methods, and evaluates their effectiveness in capturing the complex interactions between soil and structural systems. The review identifies key gaps, including a lack of unified guidelines in international codes, inadequate integration of SSI in real-world design processes, and limited exploration of its role in emerging engineering challenges like sustainability and climate resilience. Historical seismic events, such as the Kobe and Loma Prieta earthquakes, are analysed to underscore the detrimental consequences of neglecting SSI considerations. Additionally, the review discusses recent innovations, including the application of machine learning and advanced computational tools, and their potential to enhance the accuracy and efficiency of SSI analysis. This study offers actionable insights for improving design practices, such as adapting SSI frameworks for structures on soft soils and incorporating dynamic interactions in seismic design codes. It concludes with a call for interdisciplinary collaboration and future research into novel SSI applications, including its integration with smart sensing technologies and sustainable infrastructure design. This review bridges the gap between theoretical advancements and practical applications of soil-structure interaction (SSI) by synthesizing current knowledge, identifying critical research gaps, and proposing innovative solutions to enhance structural resilience, sustainability, and seismic safety. ➢ The introduction of SSI and the previous studies in seismic design is debated. ➢ Need, significance and the standard code provisions of SSI of different countries are explained. ➢ Solving methods of SSI are discussed.","datePublished":"2025-01-26T00:00:00Z","dateModified":"2025-01-26T00:00:00Z","pageStart":"1","pageEnd":"25","license":"http://creativecommons.org/licenses/by/4.0/","sameAs":"https://doi.org/10.1186/s43065-025-00118-2","keywords":["Soil-structure interaction (SSI)","Seismic design","Numerical modelling","SSI guidelines","Structural resilience","Civil Engineering"],"image":["https://media.springernature.com/lw1200/springer-static/image/art%3A10.1186%2Fs43065-025-00118-2/MediaObjects/43065_2025_118_Figa_HTML.png","https://media.springernature.com/lw1200/springer-static/image/art%3A10.1186%2Fs43065-025-00118-2/MediaObjects/43065_2025_118_Fig1_HTML.png","https://media.springernature.com/lw1200/springer-static/image/art%3A10.1186%2Fs43065-025-00118-2/MediaObjects/43065_2025_118_Fig2_HTML.png","https://media.springernature.com/lw1200/springer-static/image/art%3A10.1186%2Fs43065-025-00118-2/MediaObjects/43065_2025_118_Fig3_HTML.png","https://media.springernature.com/lw1200/springer-static/image/art%3A10.1186%2Fs43065-025-00118-2/MediaObjects/43065_2025_118_Fig4_HTML.png","https://media.springernature.com/lw1200/springer-static/image/art%3A10.1186%2Fs43065-025-00118-2/MediaObjects/43065_2025_118_Fig5_HTML.png","https://media.springernature.com/lw1200/springer-static/image/art%3A10.1186%2Fs43065-025-00118-2/MediaObjects/4306
